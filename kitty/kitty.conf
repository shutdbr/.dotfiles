# kitty, only what differs from the defaults

### font
    # no italics on purpose: the italic slots name upright faces. the style=
    # is needed, a bare family still picks the slanted face
    font_family             family="Monaspace Neon NF" style=Regular
    bold_font               family="Monaspace Neon NF" style=Bold
    italic_font             family="Monaspace Neon NF" style=Regular
    bold_italic_font        family="Monaspace Neon NF" style=Bold
    font_size               12

### window
    hide_window_decorations yes
    background_opacity      0.88

### cursor
    # fish's vi mode sets the shape, no-cursor stops kitty overriding it
    cursor_shape            block
    cursor_blink_interval   0
    shell_integration       no-cursor

### colours
    # base16-bubblegum, inverted: base07 plum behind, base00 text
    foreground              #feedf3   # base00  candy pink-white
    background              #352930   # base07  deepest plum
    cursor                  #f030a8   # base0E  hot pink
    selection_foreground    #feedf3   # base00
    selection_background    #745268   # base04  dusty rose
    url_color               #00b9a3   # base0C  teal

    # the 16 keep their ansi meaning. normal then bright
    # black — base06 / base04
    color0                  #463840
    color8                  #745268
    # red — base08
    color1                  #ed286f
    color9                  #f0487f
    # green — base0B, a teal-green in this palette
    color2                  #08c7a4
    color10                 #2ad9bb
    # yellow — not base0a, that's purple and warnings need to look like warnings
    color3                  #d79921
    color11                 #fabd2f
    # blue — base0D, leans cyan
    color4                  #00a2b8
    color12                 #22bdd2
    # magenta — base0E
    color5                  #f030a8
    color13                 #f85cbd
    # cyan — base0C
    color6                  #00b9a3
    color14                 #1fd4bd
    # white — base02 / base00
    color7                  #e0ccd1
    color15                 #feedf3
