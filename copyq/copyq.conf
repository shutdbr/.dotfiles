; copyq, only what differs from the defaults. copyq rewrites the live copy
; with every option on exit; this one stays short

[Options]
; enter copies and closes, wayland can't paste for it
activate_pastes=false
; $mod+v opens it, no tray icon
disable_tray=true
editor=kitty nvim -- %1
hide_main_window=true
hide_tabs=true
hide_toolbar=true
maxitems=500
; vi keys: j/k to move, / to search
navigation_style=1
tabs=&clipboard

[Theme]
; base16-bubblegum, the selection is the blush dunst uses
bg=#feedf3
fg=#cb2762
alt_bg=#f8e2e7
sel_bg=#a51d50
sel_fg=#feedf3
find_bg=#f4c3da
find_fg=#a51d50
edit_bg=#feedf3
edit_fg=#cb2762
num_fg=#bf5e87
font="Monaspace Neon NF,10"
edit_font="Monaspace Neon NF,10"
find_font="Monaspace Neon NF,10"
num_font="Monaspace Neon NF,8"
show_scrollbars=false
style_main_window=true
